<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Horas y Tips</title>

    <body>
        <form id="imageForm">
            <input type="file" id="imageInput" accept="image/*">
            <button type="submit">Subir Recibo</button>
        </form>
        
        <div id="totals">
            <h3>Total (Últimas 2 Semanas)</h3>
            <p>Horas trabajadas: <span id="totalHoursDisplay">0.00</span></p>
            <p>Propinas generadas: <span id="totalTipsDisplay">$0.00</span></p>
        </div>
        <script src="/js.js"></script>
    </body>
</html>
